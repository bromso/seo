# Production environment values
global:
  imageRegistry: ghcr.io/bromso/seo-audit/
  imagePullSecrets:
    - name: ghcr-secret
  environment: production
  domain: seo-audit.com

namespace:
  name: seo-audit-prod

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: seo-audit.com
      paths:
        - path: /
          pathType: Prefix
          service: www
          port: 3000
        - path: /app
          pathType: Prefix
          service: app
          port: 3001
    - host: www.seo-audit.com
      paths:
        - path: /
          pathType: Prefix
          service: www
          port: 3000
  tls:
    - secretName: seo-audit-prod-tls
      hosts:
        - seo-audit.com
        - www.seo-audit.com

app:
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

www:
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

runner:
  replicaCount: 2
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 750m
      memory: 1Gi
