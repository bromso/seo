apiVersion: v2
name: seo-audit
description: SEO Audit monorepo Helm umbrella chart
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: app
    version: "0.1.0"
    repository: "file://./charts/app"
    condition: app.enabled
  - name: www
    version: "0.1.0"
    repository: "file://./charts/www"
    condition: www.enabled
  - name: runner
    version: "0.1.0"
    repository: "file://./charts/runner"
    condition: runner.enabled
