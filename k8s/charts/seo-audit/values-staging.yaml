# Staging environment values
global:
  imageRegistry: ghcr.io/bromso/seo-audit/
  environment: staging
  domain: staging.seo-audit.com

namespace:
  name: seo-audit-staging

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: staging.seo-audit.com
      paths:
        - path: /
          pathType: Prefix
          service: www
          port: 3000
        - path: /app
          pathType: Prefix
          service: app
          port: 3001
  tls:
    - secretName: seo-audit-staging-tls
      hosts:
        - staging.seo-audit.com

app:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

www:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

runner:
  replicaCount: 1
  resources:
    limits:
      cpu: 1500m
      memory: 1.5Gi
    requests:
      cpu: 500m
      memory: 768Mi
