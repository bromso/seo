# Global settings shared across all subcharts
global:
  imageRegistry: ""
  imagePullSecrets: []
  environment: development
  domain: seo-audit.local

# Namespace configuration
namespace:
  create: true
  name: seo-audit

# Ingress configuration (shared)
ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: seo-audit.local
      paths:
        - path: /
          pathType: Prefix
          service: www
          port: 3000
        - path: /app
          pathType: Prefix
          service: app
          port: 3001
  tls: []

# Subchart configurations
app:
  enabled: true
  replicaCount: 1
  image:
    repository: seo-audit/app
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

www:
  enabled: true
  replicaCount: 1
  image:
    repository: seo-audit/www
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

runner:
  enabled: true
  replicaCount: 1
  image:
    repository: seo-audit/runner
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  secretName: seo-audit-runner
